<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Online Shopping App</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f8f9fa;
    }

    h1 {
      text-align: center;
    }

    .product {
      border: 1px solid #ddd;
      padding: 15px;
      margin: 10px;
      display: inline-block;
      width: 200px;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      text-align: center;
    }

    button {
      margin-top: 10px;
      background: #007bff;
      color: white;
      border: none;
      padding: 5px 10px;
      cursor: pointer;
      border-radius: 4px;
    }

    button:hover {
      background: #0056b3;
    }

    .cart {
      margin-top: 40px;
      background: #fff;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    ul {
      list-style: none;
      padding: 0;
    }

    li {
      margin-bottom: 10px;
    }

    .qty-buttons button {
      margin-left: 5px;
      padding: 2px 6px;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <h1>Online Shopping App</h1>

  <div id="products"></div>

  <div class="cart">
    <h2>Cart</h2>
    <ul id="cart-items"></ul>
    <p><strong>Total:</strong> ₹<span id="total">0</span></p>
  </div>

  <script>
    const products = [
      { id: 1, name: "Laptop", price: 59999 },
      { id: 2, name: "Phone", price: 29999 },
      { id: 3, name: "Tablet", price: 19999 },
      { id: 4, name: "Smartwatch", price: 9999 },
      { id: 5, name: "Headphones", price: 2999 },
    ];

    let cart = [];

    function saveCart() {
      localStorage.setItem("shoppingCart", JSON.stringify(cart));
    }

    function loadCart() {
      const stored = localStorage.getItem("shoppingCart");
      if (stored) {
        cart = JSON.parse(stored);
        updateCart();
      }
    }

    function addToCart(productId) {
      const product = products.find(p => p.id === productId);
      const existing = cart.find(item => item.id === productId);

      if (existing) {
        existing.qty++;
      } else {
        cart.push({ ...product, qty: 1 });
      }
      updateCart();
    }

    function changeQty(productId, delta) {
      const item = cart.find(p => p.id === productId);
      if (!item) return;

      item.qty += delta;
      if (item.qty <= 0) {
        cart = cart.filter(p => p.id !== productId);
      }
      updateCart();
    }

    function updateCart() {
      const cartItems = document.getElementById("cart-items");
      const totalSpan = document.getElementById("total");

      cartItems.innerHTML = "";
      let total = 0;

      cart.forEach(item => {
        const li = document.createElement("li");
        li.innerHTML = `
          ${item.name} - ₹${item.price} × ${item.qty}
          <span class="qty-buttons">
            <button onclick="changeQty(${item.id}, 1)">+</button>
            <button onclick="changeQty(${item.id}, -1)">-</button>
          </span>
        `;
        cartItems.appendChild(li);
        total += item.price * item.qty;
      });

      totalSpan.textContent = total;
      saveCart();
    }

    // Render products
    const productDiv = document.getElementById("products");
    products.forEach(product => {
      const div = document.createElement("div");
      div.className = "product";
      div.innerHTML = `
        <h3>${product.name}</h3>
        <p>Price: ₹${product.price}</p>
        <button onclick="addToCart(${product.id})">Add to Cart</button>
      `;
      productDiv.appendChild(div);
    });

    // Load saved cart on page load
    loadCart();
  </script>

</body>
</html>
